name: Validate ng-dev

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      - name: Write JWT key
        env:
          SF_PRIVATE_KEY: ${{ secrets.SF_PRIVATE_KEY }}
        run: |
          echo "$SF_PRIVATE_KEY" > /tmp/server.key
          chmod 600 /tmp/server.key

      - name: Authenticate to ng-dev
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
        run: |
          sf org login jwt --username "$SF_USERNAME" --jwt-key-file /tmp/server.key \
            --client-id "$SF_CLIENT_ID" --set-default --alias ng-dev

      - name: Dry-run deploy to ng-dev with tests
        run: |
          sf project deploy start --dry-run --test-level RunLocalTests --target-org ng-dev

      # TODO: ng-demo validation requires its own External Client App / credentials (P1-22 follow-up)
