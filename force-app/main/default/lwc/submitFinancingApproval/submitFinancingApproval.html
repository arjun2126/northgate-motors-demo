<template>
    <lightning-card title="Submit for Finance Manager Exception Approval" icon-name="standard:approval">
        <div class="slds-p-horizontal_medium slds-p-vertical_small">
            <p class="slds-m-bottom_small">
                Submits this Financing record to the Finance Manager via the Financing Exception Approval process
                when the rate is a Manual Exception or the credit tier is Sub-Prime. Idempotent: re-submits are no-ops.
            </p>
            <template if:true={message}>
                <div class={messageClass} role="status">
                    <p>{message}</p>
                </div>
            </template>
            <div class="slds-m-top_medium">
                <lightning-button
                    label="Submit for Exception Approval"
                    variant="brand"
                    onclick={invoke}
                    disabled={busy}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
