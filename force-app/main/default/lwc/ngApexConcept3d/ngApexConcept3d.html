<template>
    <section class="apex" aria-label="Northgate Apex Concept 3D viewer">
        <div class="apex-viewer">
        <div class="apex-stage" data-mode={mode}>
            <div class="apex-canvas-host" lwc:dom="manual" data-canvas-host></div>

            <img lwc:if={showPoster} class="apex-poster" src={posterUrl}
                alt="Apex Concept concept car, three-quarter front view. Illustrative only, not a vehicle in inventory." />

            <p lwc:if={showScrim} class="apex-scrim" role="status">
                <span class="apex-spinner" aria-hidden="true"></span>
                <span>{statusText}</span>
            </p>

            <p lwc:if={showError} class="apex-error" role="alert" tabindex="-1">{statusText}</p>

            <button lwc:if={showStartButton} type="button" class="apex-start" onclick={handleStart}>
                {startLabel}
            </button>

            <p lwc:if={isInteractive} class="apex-hint">
                Drag to rotate · click the stage, then scroll to zoom
            </p>
        </div>

        <p class="apex-caption">
            <span class="apex-dot" aria-hidden="true"></span>
            {captionText}
        </p>

        <div class="apex-toolbar" role="group" aria-label="Camera controls">
            <button type="button" data-cam="left" onclick={handleCamera} disabled={notInteractive} aria-label="Rotate left">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M4 10a8 8 0 1 1 2.3 6.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M4 4v6h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <button type="button" data-cam="right" onclick={handleCamera} disabled={notInteractive} aria-label="Rotate right">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M20 10a8 8 0 1 0-2.3 6.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <button type="button" data-cam="up" onclick={handleCamera} disabled={notInteractive} aria-label="Tilt up">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M12 19V5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M6.5 10.5 12 5l5.5 5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <button type="button" data-cam="down" onclick={handleCamera} disabled={notInteractive} aria-label="Tilt down">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
                    <path d="M12 5v14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path d="M6.5 13.5 12 19l5.5-5.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
            </button>
            <button type="button" data-cam="zoom-in" onclick={handleCamera} disabled={notInteractive} aria-label="Zoom in">+</button>
            <button type="button" data-cam="zoom-out" onclick={handleCamera} disabled={notInteractive} aria-label="Zoom out">−</button>
            <span class="apex-gap" aria-hidden="true"></span>
            <button type="button" data-view="front" onclick={handleView} disabled={notInteractive}>Front</button>
            <button type="button" data-view="side" onclick={handleView} disabled={notInteractive}>Side</button>
            <button type="button" data-view="rear" onclick={handleView} disabled={notInteractive}>Rear</button>
            <button type="button" data-cam="reset" onclick={handleCamera} disabled={notInteractive} class="apex-reset">Reset</button>
        </div>

        </div>
        <div class="apex-configuration">
        <fieldset class="apex-finishes">
            <legend>Preview finish</legend>
            <div class="apex-finish-grid">
                <button type="button" data-finish="carmine" onclick={handleFinish} aria-pressed={carminePressed} class={carmineClass}>
                    <span class="apex-chip apex-chip-carmine" aria-hidden="true"></span>
                    <span>Carmine</span>
                </button>
                <button type="button" data-finish="pearl" onclick={handleFinish} aria-pressed={pearlPressed} class={pearlClass}>
                    <span class="apex-chip apex-chip-pearl" aria-hidden="true"></span>
                    <span>Pearl</span>
                </button>
                <button type="button" data-finish="graphite" onclick={handleFinish} aria-pressed={graphitePressed} class={graphiteClass}>
                    <span class="apex-chip apex-chip-graphite" aria-hidden="true"></span>
                    <span>Graphite</span>
                </button>
            </div>
            <p class="apex-micro">{finishDescription}</p>
        </fieldset>

        <dl class="apex-facts">
            <div><dt>Body style</dt><dd>Concept coupé</dd></div>
            <div><dt>Interior</dt><dd>Not configurable</dd></div>
            <div><dt>Wheels</dt><dd>Fixed authored geometry</dd></div>
            <div><dt>Availability</dt><dd>Not for sale · not in inventory</dd></div>
        </dl>

        <p class="apex-note">
            Illustrative concept preview. Finishes are visual only and unpriced. No reservation, factory order,
            price or test-drive claim applies to this vehicle.
        </p>

        <a lwc:if={hasInquiryUrl} class="apex-cta" href={effectiveInquiryUrl} onclick={handleInquiry}>Discuss this concept</a>
        </div>

        <p class="apex-credit">
            3D model: “Car Concept” by Eric Chadwick, Darmstadt Graphics Group GmbH, 2024,
            <a href="https://creativecommons.org/licenses/by/4.0/" rel="license noopener noreferrer" target="_blank">CC BY 4.0</a>.
            Adapted for this demonstration: geometry and textures optimized, paint finishes re-tinted, third-party
            number-plate mark removed. No affiliation or endorsement is implied.
        </p>

        <p class="apex-sr" aria-live="polite">{announcement}</p>
    </section>
</template>
